<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" role="img" aria-label="Contact: josh.soussan.candidatures@gmail.com. Open to a 3-month summer internship."><title>Contact: josh.soussan.candidatures@gmail.com. Open to a 3-month summer internship.</title><style>@font-face{font-family:M;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:M;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:S;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
text{white-space:pre}
.m,.mb{font-family:M,'IBM Plex Mono',Consolas,Menlo,monospace}
.s,.sb{font-family:S,'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif}
.m,.s{font-weight:400}.mb,.sb{font-weight:600}
.ld{animation:ld .45s cubic-bezier(.2,.6,.3,1) both}
@keyframes ld{from{opacity:0}to{opacity:1}}
.up{animation:up .55s cubic-bezier(.2,.6,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .8s cubic-bezier(.3,.7,.2,1) both}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.flash{animation:flash 9s ease-out infinite}
@keyframes flash{0%,100%{opacity:0}2%{opacity:.9}22%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}</style><rect width="1000" height="40" fill="#000000"/><rect x=".5" y=".5" width="999" height="39" fill="none" stroke="#2b2b2b"/>
