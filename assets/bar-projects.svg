<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="img" aria-label="Featured Projects. click a panel to open the repo"><title>Featured Projects. click a panel to open the repo</title><style>@font-face{font-family:M;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:M;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:S;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
text{white-space:pre}
.m,.mb{font-family:M,'IBM Plex Mono',Consolas,Menlo,monospace}
.s,.sb{font-family:S,'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif}
